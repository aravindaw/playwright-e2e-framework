name: Smoke Tests
run-name: Smoke Tests · ${{ github.event.pull_request.title || github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: pnpm test:smoke
        env:
          CI: true

      - uses: ./.github/actions/upload-report
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
