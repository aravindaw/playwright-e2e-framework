name: Regression Tests
run-name: Regression Tests · ${{ github.event.pull_request.title || github.ref_name }}

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: pnpm test:regression
        env:
          CI: true

      - uses: ./.github/actions/upload-report
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-regression
