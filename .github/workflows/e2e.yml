name: E2E Tests
run-name: E2E Tests · ${{ github.event.pull_request.title || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: pnpm typecheck

      - run: pnpm test
        env:
          CI: true

      - uses: ./.github/actions/upload-report
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
