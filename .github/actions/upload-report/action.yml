name: Upload report
description: Upload the Playwright report and test results

inputs:
  name:
    description: Artifact name
    default: playwright-report

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: |
          playwright-report/
          test-results/
        retention-days: 14
