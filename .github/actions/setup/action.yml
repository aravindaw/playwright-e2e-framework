name: Setup
description: Install pnpm, Node, dependencies and Playwright browsers

inputs:
  browsers:
    description: Browsers to install
    default: chromium firefox webkit

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: pnpm exec playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
